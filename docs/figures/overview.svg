<text x="352" y="312" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2328">Separated by se = DH(e<tspan dy="4" font-size="10">r</tspan><tspan dy="-4">, S</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">)</tspan></text>
