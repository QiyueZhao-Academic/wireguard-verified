<text x="480.0" y="455.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle">ProVerif decides 9 of its 12 properties within 24 s; Tamarin decides all 6 lemmas within 3 s (single core, 300 s budget).</text>
